[project]
name = "cribsheet"
version = "0.10.1"
description = "Local MCP server: markdown memory with a Chroma embedding index"
readme = "README.md"
requires-python = ">=3.13"
# The real product needs all of these — they were "extras" only nominally (the
# code degrades gracefully without each, but that's a testing property, not an
# install profile). fastembed: the recommended embedder, ONNX on the runtime
# chromadb already pulls (no torch). fastmcp: serves MCP AND the warm-daemon
# path the CLI attaches to by default; pinned to the v3 line to match mcp-combiner
# so the two are co-installable. watchdog: the external-edit watchers.
# polyllmkit (md: rich CLI rendering; bridge: LLM generation for distill/elaborate/
# describe) is published on PyPI but imports as `llmkit` (dist name != import
# name). The `vendor/llmkit` submodule remains as a READING copy (in-tree xref /
# code-index; `git submodule update --remote` refreshes it) and the editable dev
# source — `uv pip install -e ./vendor/llmkit` overlays it for a session.
dependencies = [
    "pyyaml>=6.0",
    "chromadb>=0.5",   # default vector store (embedded PersistentClient)
    "fastembed>=0.3",
    "fastmcp>=3.4.2,<4",
    "watchdog>=4.0",
    # [all] pulls every LLM backend (openai/claude/anthropic/google): the daemon
    # resolves its generation adapter at runtime from config (default: claude_code),
    # so all backends must be present — a missing one crashes lifespan startup.
    # >=0.1.1: adapters raise catchable ImportError, never SystemExit.
    "polyllmkit[md,all]>=0.1.1",
]

[project.optional-dependencies]
# torch-based embedder — the ONE real extra (torch wheels are host-specific).
# The embedder auto-selects CUDA/MPS/CPU at runtime. Install torch to match
# the host BEFORE (or alongside) this extra:
#   nvidia/CUDA : default wheel        -> pip install torch
#   Apple (MPS) : default wheel        -> pip install torch
#   Pi / CPU    : CPU index (no CUDA)  -> pip install torch --index-url \
#                                         https://download.pytorch.org/whl/cpu
st = ["sentence-transformers>=2.2"]

[dependency-groups]
# Test tooling only. The suite drives asyncio through `asyncio.run()` rather than
# pytest-asyncio markers, so no async plugin is needed.
#
# basedpyright is not optional for the code-index tests: the indexer extracts symbols
# by driving a real LSP server (SERVERS in crib/codeindex.py tries ty, then
# basedpyright, then pyright for .py), and with none installed it extracts nothing and
# those tests fail rather than skip. Pinning the fallback here is what makes a bare
# runner behave like a developer machine.
#
# ruff is the lint gate CI runs. The rule set is pinned explicitly in [tool.ruff.lint]
# rather than left to ruff's defaults, so the version floor here only has to be new
# enough to understand the config — it does not decide what gets flagged.
dev = ["pytest>=8", "basedpyright>=1.19", "ruff>=0.15"]

[project.scripts]
crib = "crib.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crib"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# vendor/llmkit is a submodule reading copy of another project — it carries its own
# ruff config and is not ours to lint. _site is generated Quarto output.
extend-exclude = ["vendor", "_site"]

[tool.ruff.lint]
# Selected EXPLICITLY rather than left to ruff's defaults: 0.16 widened the default
# set from E4/E7/E9/F to ~25 more families, so "the defaults" silently redefine what
# the gate means on a version bump. This is the set the code was written against —
# real errors (F) and the pycodestyle subset — and widening it is a deliberate edit
# here, not a side effect of `uv lock --upgrade`.
select = ["E4", "E7", "E9", "F"]
# E702 (statements joined by `;`) is house style, not an oversight: the argparse
# builders in crib/cli.py and the fixture setup in tests put one logical ROW on one
# line, and the shape is what makes those tables readable.
ignore = ["E702"]
