# Thin caller for gh-quarto-publish: refresh the default-branch docs when a
# release tag is pushed.
name: docs (release tag)

on:
  push:
    tags: ["v*"]

concurrency:
  group: docs-refs/heads/main
  cancel-in-progress: true

jobs:
  deploy:
    # Inert until the deploy vars/secrets are configured on the repo.
    if: ${{ vars.DOCS_SSH_DEST != '' }}
    uses: georgeharker/gh-quarto-publish/.github/workflows/publish.yml@06fe9321b7b5a68195f7f90d4b010816766135d8 # main
    with:
      # Tags are cut from the default branch; releases refresh its docs.
      target-prefix: main
      ssh-dest: ${{ vars.DOCS_SSH_DEST }}
      site-url: ${{ vars.DOCS_SITE_URL }}
    secrets:
      deploy-key: ${{ secrets.DOCS_DEPLOY_KEY }}
      host-key: ${{ secrets.DOCS_HOST_KEY }}
