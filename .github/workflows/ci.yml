name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    check:
        # Explicit name: the check-run name is what branch protection matches
        # on, and the bare job id "check" is also used by vendored-drift.yml.
        name: tests
        runs-on: ubuntu-latest
        steps:
            # vendor/llmkit is deliberately NOT checked out: it is a reading
            # copy for the in-tree xref / code index, while the code under test
            # imports `llmkit` from the published polyllmkit wheel. Fetching it
            # would only lint-and-collect a second copy of the same package.
            - uses: actions/checkout@v6
              with:
                  # FULL history: tests/test_eval_clean_corpus.py worktree-checks
                  # out the corpus fixture's pinned source_sha, which a shallow
                  # clone doesn't know ("invalid reference") — CI has been red
                  # on this since v0.17.0.
                  fetch-depth: 0
                  # the runner never pushes; a persisted token would be both an
                  # attack surface and the zizmor `artipacked` finding
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@v10.1.0
              with:
                  python-version: "3.13"

            # tests/test_sync.py asserts GitBacking falls back to the *local*
            # default branch. A runner's git has no init.defaultBranch set, so it
            # falls back to "master" and the assertion fails on a difference in
            # the runner's git config rather than in the code. Configure the
            # default the project actually uses.
            - name: Configure git defaults
              run: git config --global init.defaultBranch main

            - name: Install (project + dev group, from uv.lock)
              run: uv sync

            # Lint before the suite: it takes a second and its failures are
            # unambiguous, so a style break reports as a style break rather
            # than as whatever the tests happen to say three minutes later.
            - name: Lint (ruff)
              run: uv run ruff check .

            # The retrieval quality gate (tests/test_eval_retrieval.py) needs a
            # seeded crib store and a warm daemon, neither of which exists on a
            # runner; its harness exits 2 there and the test skips itself.
            # Everything else is a plain unit test.
            - name: Tests (pytest)
              # In parallel (pytest-xdist): each test has its own tmp dirs and
              # free ports, so -n auto is safe; serial took ~27 min here. The
              # tests that drive a REAL language server run in the next step.
              run: >-
                  uv run pytest -q -n auto
                  --ignore=tests/test_codeindex.py
                  --ignore=tests/test_code_integrity.py

            - name: Tests that drive a real language server (pytest, serial)
              # A runner has no ty, so crib falls back to basedpyright, whose cold
              # start answers the first callHierarchy in ~40 s on a developer
              # machine and much more on a runner. Run in parallel with the rest
              # of the suite (every core busy, each worker starting its own
              # servers) it went past even 180 s; on its own it fits.
              env:
                  CRIB_LSP_TIMEOUT: "180"
              run: uv run pytest -q tests/test_codeindex.py tests/test_code_integrity.py
